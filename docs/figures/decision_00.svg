<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-label="r3d 추출에서 사람 깊이, SMPL 다리 fit, 무릎각 시계열, IMU 검증으로 이어지는 흐름. 별도 STAND 촬영에서 만든 체형 β와 4D-Humans 초기 자세가 SMPL fit 단계로 들어간다.">
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
        <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f55c4"/></marker>
      </defs>
      <g font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="13" fill="currentColor">
        <!-- IMU source -->
        <rect x="905" y="18" width="180" height="58" rx="4" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
        <text x="995" y="42" text-anchor="middle" font-weight="600">Xsens MTw × 6</text>
        <text x="995" y="62" text-anchor="middle" font-size="12" opacity=".75">허벅지·정강이·발 · 100 Hz</text>
        <line x1="995" y1="76" x2="995" y2="128" stroke="currentColor" marker-end="url(#ar)"/>
        <text x="1003" y="106" font-size="12" opacity=".8">쿼터니언</text>

        <!-- main row boxes -->
        <rect x="15" y="130" width="170" height="96" rx="4" fill="none" stroke="currentColor"/>
        <text x="100" y="156" text-anchor="middle" font-weight="600">A · 추출</text>
        <text x="100" y="178" text-anchor="middle" font-size="12">.r3d → RGB 1440×1920</text>
        <text x="100" y="196" text-anchor="middle" font-size="12">LiDAR 256×192 + conf</text>
        <text x="100" y="214" text-anchor="middle" font-size="12">보행 구간 250f</text>

        <rect x="235" y="130" width="190" height="96" rx="4" fill="none" stroke="currentColor"/>
        <text x="330" y="156" text-anchor="middle" font-weight="600">B · 사람 metric depth</text>
        <text x="330" y="178" text-anchor="middle" font-size="12">Sapiens Seg/Depth/Normal</text>
        <text x="330" y="196" text-anchor="middle" font-size="12">LiDAR anchor z = a·s + b</text>
        <text x="330" y="214" text-anchor="middle" font-size="12">전역 a 재-anchor</text>

        <rect x="475" y="130" width="190" height="96" rx="4" fill="none" stroke="#1f55c4" stroke-width="2"/>
        <text x="570" y="156" text-anchor="middle" font-weight="600">C · SMPL 하체 fit</text>
        <text x="570" y="178" text-anchor="middle" font-size="12">A0 root 정렬</text>
        <text x="570" y="196" text-anchor="middle" font-size="12">near 다리 → far 다리</text>
        <text x="570" y="214" text-anchor="middle" font-size="12">9-DOF × 2, λ_prior = 0</text>

        <rect x="715" y="130" width="160" height="96" rx="4" fill="none" stroke="currentColor"/>
        <text x="795" y="156" text-anchor="middle" font-weight="600">D · 무릎각</text>
        <text x="795" y="178" text-anchor="middle" font-size="12">측정 근거 태깅</text>
        <text x="795" y="196" text-anchor="middle" font-size="12">붕괴 gap 보간</text>
        <text x="795" y="214" text-anchor="middle" font-size="12">값 · σ · 라벨</text>

        <rect x="915" y="130" width="160" height="96" rx="4" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
        <text x="995" y="156" text-anchor="middle" font-weight="600">E · IMU 검증</text>
        <text x="995" y="178" text-anchor="middle" font-size="12">점프 착지 동기화</text>
        <text x="995" y="196" text-anchor="middle" font-size="12">RMSE · bias · r</text>
        <text x="995" y="214" text-anchor="middle" font-size="12">(진행 중)</text>

        <!-- main arrows -->
        <line x1="185" y1="178" x2="233" y2="178" stroke="currentColor" marker-end="url(#ar)"/>
        <line x1="425" y1="178" x2="473" y2="178" stroke="currentColor" marker-end="url(#ar)"/>
        <line x1="665" y1="178" x2="713" y2="178" stroke="currentColor" marker-end="url(#ar)"/>
        <line x1="875" y1="178" x2="913" y2="178" stroke="currentColor" marker-end="url(#ar)"/>
        <text x="449" y="122" text-anchor="middle" font-size="12" opacity=".8">metric depth</text>
        <text x="689" y="122" text-anchor="middle" font-size="12" opacity=".8">다리 θ</text>
        <text x="894" y="122" text-anchor="middle" font-size="12" opacity=".8">무릎각</text>

        <!-- 4DH branch -->
        <rect x="235" y="300" width="190" height="62" rx="4" fill="none" stroke="currentColor"/>
        <text x="330" y="326" text-anchor="middle" font-weight="600">4D-Humans (HMR2)</text>
        <text x="330" y="346" text-anchor="middle" font-size="12">프레임별 초기 자세</text>
        <polyline points="100,226 100,331 233,331" fill="none" stroke="currentColor" marker-end="url(#ar)"/>
        <text x="108" y="320" font-size="12" opacity=".8">RGB</text>
        <polyline points="425,331 520,331 520,228" fill="none" stroke="currentColor" marker-end="url(#ar)"/>
        <text x="430" y="322" font-size="12" opacity=".8">body_pose 초기값</text>

        <!-- STAND branch -->
        <rect x="560" y="300" width="250" height="62" rx="4" fill="none" stroke="#1f55c4" stroke-width="2"/>
        <text x="685" y="326" text-anchor="middle" font-weight="600">BC · STAND 4방향 정자세 (별도 촬영)</text>
        <text x="685" y="346" text-anchor="middle" font-size="12">II-8 → II-10 → II-12 → II-13</text>
        <line x1="620" y1="300" x2="620" y2="228" stroke="#1f55c4" stroke-width="2" marker-end="url(#arp)"/>
        <text x="628" y="270" font-size="12" fill="#1f55c4" font-weight="600">β 고정 (10개)</text>

        <!-- decision markers -->
        <g font-family="IBM Plex Mono, Consolas, monospace" font-size="11.5" fill="#1f55c4">
          <text x="235" y="246">D3 D4 D5</text>
          <text x="475" y="246">D1 D6 D7 D8</text>
          <text x="715" y="246">D9 D10</text>
          <text x="15" y="246">D11</text>
          <text x="560" y="380">D1 D2</text>
        </g>
        <text x="15" y="440" font-size="12" opacity=".75">실선 = 4/20 세션에서 실행 완료 · 점선 = 7/29 세션(1·3·6 km/h)에서 진행 중 · 굵은 파랑 = 체형 β 경로</text>
      </g>
    </svg>