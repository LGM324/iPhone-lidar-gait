<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-label="Pipeline: iPhone .r3d recording is extracted, converted to metric person depth, fitted with an SMPL lower body, turned into a labeled knee-angle time series, and validated against Xsens IMUs. A personal body shape from a separate standing capture and 4D-Humans initial poses feed the SMPL fit.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18202b"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f55c4"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="470" fill="#ffffff"/>
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#18202b">
    <rect x="905" y="18" width="180" height="58" rx="4" fill="none" stroke="#18202b" stroke-dasharray="4 3"/>
    <text x="995" y="42" text-anchor="middle" font-weight="600">Xsens MTw × 6</text>
    <text x="995" y="62" text-anchor="middle" font-size="12" fill="#4a5566">thigh · shank · foot · 100 Hz</text>
    <line x1="995" y1="76" x2="995" y2="128" stroke="#18202b" marker-end="url(#ar)"/>
    <text x="1003" y="106" font-size="12" fill="#4a5566">quaternions</text>

    <rect x="15" y="130" width="170" height="96" rx="4" fill="none" stroke="#18202b"/>
    <text x="100" y="156" text-anchor="middle" font-weight="600">A · Extract</text>
    <text x="100" y="178" text-anchor="middle" font-size="12">iPhone .r3d → RGB</text>
    <text x="100" y="196" text-anchor="middle" font-size="12">LiDAR 256×192 + conf</text>
    <text x="100" y="214" text-anchor="middle" font-size="12">steady-gait window</text>

    <rect x="235" y="130" width="190" height="96" rx="4" fill="none" stroke="#18202b"/>
    <text x="330" y="156" text-anchor="middle" font-weight="600">B · Metric person depth</text>
    <text x="330" y="178" text-anchor="middle" font-size="12">Sapiens seg/depth/normal</text>
    <text x="330" y="196" text-anchor="middle" font-size="12">LiDAR anchor z = a·s + b</text>
    <text x="330" y="214" text-anchor="middle" font-size="12">one global scale a</text>

    <rect x="475" y="130" width="190" height="96" rx="4" fill="none" stroke="#1f55c4" stroke-width="2"/>
    <text x="570" y="156" text-anchor="middle" font-weight="600">C · SMPL lower-body fit</text>
    <text x="570" y="178" text-anchor="middle" font-size="12">root alignment</text>
    <text x="570" y="196" text-anchor="middle" font-size="12">near leg → far leg</text>
    <text x="570" y="214" text-anchor="middle" font-size="12">9 DOF × 2, no pose prior</text>

    <rect x="715" y="130" width="160" height="96" rx="4" fill="none" stroke="#18202b"/>
    <text x="795" y="156" text-anchor="middle" font-weight="600">D · Knee angles</text>
    <text x="795" y="178" text-anchor="middle" font-size="12">evidence tagging</text>
    <text x="795" y="196" text-anchor="middle" font-size="12">occlusion-gap infill</text>
    <text x="795" y="214" text-anchor="middle" font-size="12">value · σ · label</text>

    <rect x="915" y="130" width="160" height="96" rx="4" fill="none" stroke="#18202b" stroke-dasharray="4 3"/>
    <text x="995" y="156" text-anchor="middle" font-weight="600">E · IMU validation</text>
    <text x="995" y="178" text-anchor="middle" font-size="12">jump-landing sync</text>
    <text x="995" y="196" text-anchor="middle" font-size="12">RMSE · bias · r</text>
    <text x="995" y="214" text-anchor="middle" font-size="12">1 / 3 / 6 km/h</text>

    <line x1="185" y1="178" x2="233" y2="178" stroke="#18202b" marker-end="url(#ar)"/>
    <line x1="425" y1="178" x2="473" y2="178" stroke="#18202b" marker-end="url(#ar)"/>
    <line x1="665" y1="178" x2="713" y2="178" stroke="#18202b" marker-end="url(#ar)"/>
    <line x1="875" y1="178" x2="913" y2="178" stroke="#18202b" marker-end="url(#ar)"/>
    <text x="449" y="122" text-anchor="middle" font-size="12" fill="#4a5566">depth (m)</text>
    <text x="689" y="122" text-anchor="middle" font-size="12" fill="#4a5566">leg θ</text>
    <text x="894" y="122" text-anchor="middle" font-size="12" fill="#4a5566">knee °</text>

    <rect x="235" y="300" width="190" height="62" rx="4" fill="none" stroke="#18202b"/>
    <text x="330" y="326" text-anchor="middle" font-weight="600">4D-Humans (HMR 2.0)</text>
    <text x="330" y="346" text-anchor="middle" font-size="12">per-frame initial pose</text>
    <polyline points="100,226 100,331 233,331" fill="none" stroke="#18202b" marker-end="url(#ar)"/>
    <text x="108" y="320" font-size="12" fill="#4a5566">RGB</text>
    <polyline points="425,331 520,331 520,228" fill="none" stroke="#18202b" marker-end="url(#ar)"/>
    <text x="430" y="322" font-size="12" fill="#4a5566">pose init</text>

    <rect x="560" y="300" width="250" height="62" rx="4" fill="none" stroke="#1f55c4" stroke-width="2"/>
    <text x="685" y="326" text-anchor="middle" font-weight="600">Standing 4-view capture (separate)</text>
    <text x="685" y="346" text-anchor="middle" font-size="12">per-view fit → canonical fusion</text>
    <line x1="620" y1="300" x2="620" y2="228" stroke="#1f55c4" stroke-width="2" marker-end="url(#arp)"/>
    <text x="628" y="270" font-size="12" fill="#1f55c4" font-weight="600">body shape β (frozen)</text>

    <text x="15" y="440" font-size="12" fill="#4a5566">Dashed = IMU validation stage · Blue = personal body-shape path</text>
  </g>
</svg>
